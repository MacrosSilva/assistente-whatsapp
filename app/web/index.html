<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Assistente</title>
  <link rel="icon" href="/web/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/painel.css">
  <script type="module" src="/web/js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <a class="marca" href="#/">
        <img src="/web/icone.svg" alt="" width="30" height="30">
        <span>Assistente</span>
      </a>
      <nav class="menu" id="menu" aria-label="Seções do painel"></nav>
      <div class="lateral-rodape">
        <a class="whats-mini" href="#/whatsapp" id="whats-mini">
          <span class="ponto"></span><span class="txt">WhatsApp…</span>
        </a>
        <button class="botao-icone" id="bt-tema" title="Alternar tema claro/escuro" aria-label="Alternar tema"></button>
      </div>
    </aside>

    <main class="principal">
      <div class="faixa oculto" id="faixa"></div>
      <div id="conteudo" class="conteudo"></div>
    </main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
